<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="noindex" name="robots"/>
<title>Page Not Found — Nostrix</title>
<style>
:root{
  --bg:#08090d;
  --text:#f7f7fb;
  --muted:#9697a4;
  --a1:#b8c3ff;
  --a2:#d679ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 10%,rgba(184,195,255,.10),transparent 30rem),
    radial-gradient(circle at 92% 88%,rgba(214,121,255,.09),transparent 34rem),
    #08090d;
}
.error-scene{
  position:relative;
  width:min(100%,980px);
  min-height:620px;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.error-number{
  position:absolute;
  inset:50% auto auto 50%;
  z-index:-1;
  transform:translate(-50%,-55%);
  margin:0;
  font-size:clamp(15rem,38vw,34rem);
  line-height:.75;
  font-weight:800;
  letter-spacing:-.09em;
  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.055);
  text-shadow:
    0 0 100px rgba(184,195,255,.035),
    0 0 150px rgba(214,121,255,.03);
  user-select:none;
  pointer-events:none;
}
.error-content{
  width:min(100%,700px);
  text-align:center;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:13px;
  color:#fff;
  text-decoration:none;
  margin-bottom:62px;
}
.brand-mark{
  width:42px;
  height:30px;
  position:relative;
  display:block;
}
.brand-mark::before{
  content:"";
  position:absolute;
  left:0;
  top:2px;
  width:26px;
  height:26px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  border-radius:2px;
}
.brand-mark::after{
  content:"";
  position:absolute;
  right:0;
  top:2px;
  width:26px;
  height:26px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  border-radius:50%;
  opacity:.95;
}
.brand-name{
  font-size:.95rem;
  font-weight:800;
  letter-spacing:.34em;
  text-transform:uppercase;
}
.kicker{
  margin:0 0 18px;
  color:#c98cff;
  font-size:.69rem;
  font-weight:800;
  letter-spacing:.28em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(2.5rem,7vw,5.4rem);
  line-height:.96;
  letter-spacing:-.05em;
}
.copy{
  margin:22px auto 0;
  max-width:540px;
  color:var(--muted);
  font-size:clamp(.95rem,1.7vw,1.08rem);
  line-height:1.75;
}
.tagline{
  display:block;
  margin-top:7px;
  color:#d8d8df;
}
.actions{
  margin-top:34px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}
.btn{
  min-height:52px;
  padding:0 22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:999px;
  text-decoration:none;
  font-size:.73rem;
  font-weight:800;
  letter-spacing:.11em;
  text-transform:uppercase;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.btn:hover{transform:translateY(-2px)}
.primary{
  color:#101014;
  background:linear-gradient(110deg,var(--a1),var(--a2));
  box-shadow:0 14px 38px rgba(204,128,255,.12);
}
.secondary{
  color:#eee;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.025);
}
.secondary:hover{border-color:rgba(255,255,255,.22)}
@media(max-width:640px){
  .error-scene{min-height:540px}
  .brand{margin-bottom:44px}
  .error-number{font-size:clamp(12rem,55vw,18rem)}
  .actions{display:grid}
  .btn{width:min(100%,320px)}
}

.error-language-toggle{position:fixed!important;top:max(1rem,env(safe-area-inset-top));inset-inline-end:max(1rem,env(safe-area-inset-right));z-index:20}.legal-mini-footer{position:fixed;left:50%;bottom:max(.85rem,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);margin:0;padding:.8rem 1rem;border:0;background:rgba(8,9,13,.7);backdrop-filter:blur(10px);border-radius:999px}
</style>
</head>
<body><button aria-label="تحويل الموقع إلى العربية" class="language-toggle error-language-toggle" type="button">العربية</button>
<main class="error-scene">
<div aria-hidden="true" class="error-number">404</div>
<div class="error-content">
<a aria-label="Nostrix home" class="brand" href="/">
<span aria-hidden="true" class="brand-mark"></span>
<span class="brand-name">Nostrix</span>
</a>
<p class="kicker">Page not found</p>
<h1>This page slipped out of frame.</h1>
<p class="copy">
      The page you’re looking for may have moved or no longer exists.
      <span class="tagline">Made to be seen. Not lost.</span>
</p>
<div class="actions">
<a class="btn primary" href="/">Back to Nostrix <span aria-hidden="true">↗</span></a>
<a class="btn secondary" href="/portfolio/">View Portfolio</a>
</div>
</div>
</main>
<div class="legal-mini-footer"><a href="/privacy/">Privacy Policy</a><a href="/terms/">Terms &amp; Conditions</a></div><script src="/language.js"></script></body>
</html>
