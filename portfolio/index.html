<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nostrix Marketing Services portfolio.">
    <link rel="canonical" href="https://nostrix.ae/portfolio/">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="shortcut icon" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <title>Portfolio | Nostrix Marketing Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{color-scheme:dark;--bg:#08080b;--panel:#14141a;--line:rgba(255,255,255,.14);--text:#f7f7fa;--muted:#a7a7b2}
        *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,rgba(130,150,255,.13),transparent 34%),radial-gradient(circle at 92% 20%,rgba(199,125,255,.12),transparent 32%),var(--bg)}
        a{color:inherit}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:34px 0 48px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:45px}.brand{text-decoration:none;font-family:Syncopate,sans-serif;letter-spacing:.24em;font-size:.9rem}.back{text-decoration:none;color:#b9bac5}.back:hover{color:#fff}.eyebrow{color:#dc8cff;font-family:Syncopate,sans-serif;letter-spacing:.24em;font-size:.72rem;text-transform:uppercase}h1{font-family:Syncopate,sans-serif;text-transform:uppercase;font-size:clamp(2rem,6vw,4.8rem);line-height:1.02;margin:18px 0 16px}.intro{color:var(--muted);max-width:760px;line-height:1.8;margin-bottom:28px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:.75rem;border:1px solid var(--line)}.button.primary{color:#111118;border:0;background:linear-gradient(90deg,#b8c3ff,#d679ff)}.viewer{background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden;min-height:72vh;box-shadow:0 28px 90px rgba(0,0,0,.36)}iframe{width:100%;height:78vh;min-height:640px;border:0;background:#111117}@media(max-width:700px){.shell{width:min(100% - 22px,1180px);padding-top:22px}.viewer{min-height:65vh}iframe{height:68vh;min-height:520px}header{margin-bottom:32px}}
    </style>
</head>
<body>
<main class="shell">
<header><a class="brand" href="../">Nostrix</a><a class="back" href="../#portfolio">← Back to the website</a></header>
<div class="eyebrow">Selected work</div><h1>Our Portfolio</h1><p class="intro">Explore Nostrix photography and visual content across modelling, events, weddings, automotive, products and property.</p>
<div class="actions"><a class="button primary" href="../nostrix-portfolio.pdf" target="_blank" rel="noopener noreferrer">Open full portfolio ↗</a><a class="button" href="../#contact">Start a project ↓</a></div>
<section class="viewer" aria-label="Nostrix portfolio PDF preview"><iframe src="../nostrix-portfolio.pdf#view=FitH" title="Nostrix portfolio"></iframe></section>
</main><script src="../site-config.js"></script><script src="../analytics.js"></script>
</body></html>
